<script>

  // Start detection
  setInterval(checkForDevTools, detectionConfig.checkInterval);
  
  // Prevent keyboard shortcuts
  window.addEventListener('keydown', (e) => {
    if (e.key === 'F12' ||

        (e.ctrlKey && e.shiftKey && e.key === 'J')) {
      e.preventDefault();

      return false;
    }
  });
  
  // Prevent right-click
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    handleDevToolsDetection();
    return false;
  });
  
  // Prevent text selection
  document.addEventListener('selectstart', function(e) {
    e.preventDefault();
    return false;
  });
  
  // Tab change detection
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') {
      document.title = "Discord.gg/qbot";
    } else {
      document.title = "WEED THE STRONGEST";
    }
  });

// Main application code
document.addEventListener('DOMContentLoaded', function() {
  const getBtn = document.getElementById('visualzBtn');
  const cfxInput = document.getElementById('visualzCfx');
  const errorMessage = document.getElementById('errorMessage');
  const successMessage = document.getElementById('successMessage');
  const loadingSpinner = document.getElementById('loadingSpinner');
  
  function extractServerId(input) {
    const match = input.match(/(?:cfx\.re\/join\/|connect\/)?([a-z0-9]{6,8})/i);
    return match ? match[1] : null;
  }
  
  async function fetchServerData(serverId) {
    try {
      loadingSpinner.style.display = 'block';
      getBtn.disabled = true;
      getBtn.textContent = 'Searching...';
      
      const response = await fetch(`https://servers-frontend.fivem.net/api/servers/single/${serverId}`);
      if (!response.ok) {
        throw new Error('Failed to fetch server data');
      }
      return await response.json();
    } catch(error) {
      console.error('Error fetching server data:', error);
      throw error;
    } finally {
      loadingSpinner.style.display = 'none';
      getBtn.disabled = false;
      getBtn.textContent = 'SEARCH';
    }
  }
  
  async function fetchIPGeoData(ipAddress) {
    try {
      if (!ipAddress || ipAddress === 'undefined') return null;
      
      const response = await fetch(`https://ipapi.co/${ipAddress}/json`);
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      
      const data = await response.json();
      if (data && !data.error) {
        return {
          ip: data.ip,
          country: data.country_name,
          countryCode: data.country_code,
          region: data.region,
          city: data.city,
          isp: data.org,
          org: data.org,
          as: data.asn
        };
      } else {
        console.error('IP API returned error:', data);
        return null;
      }
    } catch(error) {
      console.error('Error fetching geolocation data:', error);
      return null;
    }
  }
  
  async function fetchClientData(ownerName, serverId) {
    try {
      const baseUrl = 'https://visualz-fix-cors.herokuapp.com/';
      const endpoints = [
        `${baseUrl}https://${ownerName}-${serverId}.users.cfx.re/client`,
        `${baseUrl}https://cfx.re/join/${serverId}/client`
      ];
      
      for (const endpoint of endpoints) {
        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            body: 'method=getEndpoints'
          });
          if (response.ok) return await response.json();
        } catch(e) {
          console.error(`Failed to fetch from ${endpoint}:`, e);
        }
      }
      
      throw new Error('All endpoints failed');
    } catch(error) {
      console.error('Error fetching client data:', error);
      return null;
    }
  }
  
  function cleanServerName(name) {
    if (!name) return '';
    return name.replace(/\^[0-9]/g, '');
  }
  
  function copyToClipboard(elementId) {
    const element = document.getElementById(elementId);
    const text = element.textContent;
    
    navigator.clipboard.writeText(text)
      .then(() => {
        const copyBtn = element.nextElementSibling;
        if (copyBtn && copyBtn.classList.contains('copy-btn')) {
          copyBtn.textContent = 'Copied!';
          setTimeout(() => {
            copyBtn.textContent = 'Copy';
          }, 2000);
        }
      })
      .catch(err => {
        console.error('Failed to copy text: ', err);
      });
  }
  
  function copyAllLocationInfo() {
    const country = document.getElementById('countryValue')?.textContent || '';
    const region = document.getElementById('regionValue')?.textContent || '';
    const city = document.getElementById('cityValue')?.textContent || '';
    const isp = document.getElementById('ispValue')?.textContent || '';
    const org = document.getElementById('orgValue')?.textContent || '';
    const as = document.getElementById('asValue')?.textContent || '';
    
    const text = `Country: ${country}\nRegion: ${region}\nCity: ${city}\nISP: ${isp}\nOrganization: ${org}\nAS Number: ${as}`;
    
    navigator.clipboard.writeText(text)
      .then(() => {
        const copyBtn = document.getElementById('copyLocationBtn');
        copyBtn.textContent = 'Copied All!';
        setTimeout(() => {
          copyBtn.textContent = 'Copy All Location Info';
        }, 2000);
      })
      .catch(err => {
        console.error('Failed to copy location info: ', err);
      });
  }
  
  function showAllInfoGroups() {
    for (let i = 1; i <= 5; i++) {
      document.getElementById(`serverInfoGroup${i}`).style.display = 'block';
    }
  }
  
  function hideAllInfoGroups() {
    for (let i = 1; i <= 5; i++) {
      document.getElementById(`serverInfoGroup${i}`).style.display = 'none';
    }
  }
  
  const visualzApi = async () => {
    const inputValue = cfxInput.value.trim();
    const serverId = extractServerId(inputValue);
    
    if (!serverId) {
      errorMessage.textContent = 'Invalid CFX.re link! Format: cfx.re/join/abc123 or just abc123';
      errorMessage.style.display = 'block';
      successMessage.style.display = 'none';
      hideAllInfoGroups();
      setTimeout(() => {
        errorMessage.style.display = 'none';
      }, 5000);
      return;
    }
    
    try {
      const serverData = await fetchServerData(serverId);
      
      if (!serverData || !serverData.Data) {
        throw new Error('Invalid server data received');
      }
      
      showAllInfoGroups();
      document.getElementsByClassName("u-text-1")[0].style.margin = "125px auto 0";
      
      // Server Name and ID
      document.getElementById('serverName').innerHTML = `
        <div class="info-row">
          <span class="info-label">Server Name</span>
          <span class="info-value">
            <span id="serverNameValue">${cleanServerName(serverData.Data?.hostname)}</span>
            <button class="copy-btn" onclick="copyToClipboard('serverNameValue')">Copy</button>
          </span>
        </div>
        <div class="info-row">
          <span class="info-label">Server ID</span>
          <span class="info-value">
            <span id="serverIdValue">${serverId.toUpperCase()}</span>
            <button class="copy-btn" onclick="copyToClipboard('serverIdValue')">Copy</button>
          </span>
        </div>
      `;
      
      // Gamebuild
      document.getElementById('serverGamebuild').innerHTML = `
        <div class="info-row">
          <span class="info-label">Gamebuild</span>
          <span class="info-value">
            <span id="gamebuildValue">${serverData.Data?.vars?.sv_enforceGameBuild || ''}</span>
            <button class="copy-btn" onclick="copyToClipboard('gamebuildValue')">Copy</button>
          </span>
        </div>
      `;
      
      // Players
      document.getElementById('serverPlayers').innerHTML = `
        <div class="info-row">
          <span class="info-label">Players</span>
          <span class="info-value">
            <span id="playersValue">${serverData.Data?.clients || 0}/${serverData.Data?.sv_maxclients || 0}</span>
            <button class="copy-btn" onclick="copyToClipboard('playersValue')">Copy</button>
          </span>
        </div>
      `;
      
      // Onesync
      document.getElementById('serverOnesync').innerHTML = `
        <div class="info-row">
          <span class="info-label">Onesync</span>
          <span class="info-value">
            <span id="onesyncValue">${serverData.Data?.vars?.onesync_enabled || ''}</span>
            <button class="copy-btn" onclick="copyToClipboard('onesyncValue')">Copy</button>
          </span>
        </div>
      `;
      
      // Owner Profile
      document.getElementById('serverOwner').innerHTML = `
        <div class="info-row">
          <span class="info-label">Owner Profile</span>
          <span class="info-value">
            <span id="ownerProfileValue">${serverData.Data?.ownerProfile || ''}</span>
            <button class="copy-btn" onclick="copyToClipboard('ownerProfileValue')">Copy</button>
          </span>
        </div>
      `;
      
      // Server Address
      let ipAddress = '';
      let port = '';
      
      if (serverData.Data?.connectEndPoints?.[0]) {
        const endpoint = serverData.Data.connectEndPoints[0];
        
        if (endpoint.startsWith('http')) {
          const clientData = await fetchClientData(serverData.Data.ownerName, serverId);
          if (clientData && clientData[0]) {
            ipAddress = clientData[0].split(':')[0] || '';
            port = clientData[0].split(':')[1] || '';
          }
        } else {
          const parts = endpoint.split(':');
          ipAddress = parts[0] || '';
          port = parts[1] || '';
        }
      } else {
        const clientData = await fetchClientData(serverData.Data.ownerName, serverId);
        if (clientData && clientData[0]) {
          ipAddress = clientData[0].split(':')[0] || '';
          port = clientData[0].split(':')[1] || '';

      }
      
      document.getElementById('serverAddress').innerHTML = `

            <span id="serverAddressValue">${ipAddress}:${port}</span>

        </div>
      `;
      
      // Location Info
      if (ipAddress && ipAddress !== 'undefined') {
        const geoData = await fetchIPGeoData(ipAddress);
        
        if (geoData) {
          document.getElementById('serverCountry').innerHTML = `
            <div class="info-row">
              <span class="info-label">Country</span>
              <span class="info-value">
                <span id="countryValue">${geoData.country || ''} (${geoData.countryCode || ''})</span>
                <button class="copy-btn" onclick="copyToClipboard('countryValue')">Copy</button>
              </span>
            </div>
            <div class="info-row">
              <span class="info-label">Region</span>
              <span class="info-value">
                <span id="regionValue">${geoData.region || ''}</span>
                <button class="copy-btn" onclick="copyToClipboard('regionValue')">Copy</button>
              </span>
            </div>
            <div class="info-row">
              <span class="info-label">City</span>
              <span class="info-value">
                <span id="cityValue">${geoData.city || ''}</span>
                <button class="copy-btn" onclick="copyToClipboard('cityValue')">Copy</button>
              </span>
            </div>
          `;
          
          document.getElementById('serverISP').innerHTML = `
            <div class="info-row">
              <span class="info-label">ISP</span>
              <span class="info-value">
                <span id="ispValue">${geoData.isp || ''}</span>
                <button class="copy-btn" onclick="copyToClipboard('ispValue')">Copy</button>
              </span>
            </div>
            <div class="info-row">
              <span class="info-label">Organization</span>
              <span class="info-value">
                <span id="orgValue">${geoData.org || ''}</span>
                <button class="copy-btn" onclick="copyToClipboard('orgValue')">Copy</button>
              </span>
            </div>
            <div class="info-row">
              <span class="info-label">AS Number</span>
              <span class="info-value">
                <span id="asValue">${geoData.as || ''}</span>
                <button class="copy-btn" onclick="copyToClipboard('asValue')">Copy</button>
              </span>
            </div>
          `;
        } else {
          // Fallback when geo data is not available
          document.getElementById('serverCountry').innerHTML = `
            <div class="info-row">
              <span class="info-label">Country</span>
              <span class="info-value">N/A</span>
            </div>
            <div class="info-row">
              <span class="info-label">Region</span>
              <span class="info-value">N/A</span>
            </div>
            <div class="info-row">
              <span class="info-label">City</span>
              <span class="info-value">N/A</span>
            </div>
          `;
          
          document.getElementById('serverISP').innerHTML = `
            <div class="info-row">
              <span class="info-label">ISP</span>
              <span class="info-value">N/A</span>
            </div>
            <div class="info-row">
              <span class="info-label">Organization</span>
              <span class="info-value">N/A</span>
            </div>
            <div class="info-row">
              <span class="info-label">AS Number</span>
              <span class="info-value">N/A</span>
            </div>
          `;
        }
      } else {
        // Fallback when IP is not available
        document.getElementById('serverCountry').innerHTML = `
          <div class="info-row">
            <span class="info-label">Country</span>
            <span class="info-value">IP not available</span>
          </div>
          <div class="info-row">
            <span class="info-label">Region</span>
            <span class="info-value">IP not available</span>
          </div>
          <div class="info-row">
            <span class="info-label">City</span>
            <span class="info-value">IP not available</span>
          </div>
        `;
        
        document.getElementById('serverISP').innerHTML = `
          <div class="info-row">
            <span class="info-label">ISP</span>
            <span class="info-value">IP not available</span>
          </div>
          <div class="info-row">
            <span class="info-label">Organization</span>
            <span class="info-value">IP not available</span>
          </div>
          <div class="info-row">
            <span class="info-label">AS Number</span>
            <span class="info-value">IP not available</span>
          </div>
        `;
      }
      
      successMessage.style.display = 'block';
      errorMessage.style.display = 'none';
      setTimeout(() => {
        successMessage.style.display = 'none';
      }, 3000);
      
    } catch(error) {
      errorMessage.innerHTML = `Failed to fetch server data.<br><br>Possible reasons:<br>1. Server is offline/private<br>2. IP not exposed by server<br>3. Temporary API issue<br><br>Error: ${error}`;
      errorMessage.style.display = 'block';
      successMessage.style.display = 'none';
      hideAllInfoGroups();
      setTimeout(() => {
        errorMessage.style.display = 'none';
      }, 5000);
    }
  };
  
  getBtn.addEventListener('click', visualzApi);
  cfxInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') visualzApi();
  });
  
  document.getElementById('copyLocationBtn').addEventListener('click', copyAllLocationInfo);
});
</script>
